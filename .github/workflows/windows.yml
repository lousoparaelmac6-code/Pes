name: Build PES Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PES_VERSION: 1.0.${{ github.run_number }}
      RELEASE_REPO: lousoparaelmac6-code/pes-releases
    steps:
      - name: Checkout PES
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build:windows
      - name: Verify custom Windows icon
        shell: pwsh
        run: |
          if (!(Test-Path "assets/generated/pes-icon.ico")) { throw "No se generó el icono ICO de PES." }
          if (!(Test-Path "dist/pes-icon.png")) { throw "No se copió el icono PNG al paquete de la aplicación." }
          Write-Host "Iconos de Windows verificados."
      - name: Verify installer
        shell: pwsh
        run: |
          $file = "release-win/PES-Windows-Setup.exe"
          if (!(Test-Path $file)) { throw "No se generó el instalador esperado: $file" }
          if ((Get-Item $file).Length -lt 1000000) { throw "El instalador es demasiado pequeño; se detiene la publicación." }
      - name: Smoke-test installer on Windows
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = (Resolve-Path "release-win/PES-Windows-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList @("/S") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "El instalador terminó con código $($process.ExitCode)." }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/PES/PES.exe"
          if (!(Test-Path $installedExe)) { throw "El instalador se ejecutó pero no dejó PES.exe en la ruta esperada: $installedExe" }
          $asar = Join-Path $env:LOCALAPPDATA "Programs/PES/resources/app.asar"
          if (!(Test-Path $asar)) { throw "La instalación no contiene resources/app.asar." }
          Write-Host "Smoke test OK: instalador ejecutado e instalación verificada."
      - name: Generate update manifest
        shell: pwsh
        run: node scripts/make-manifest.mjs windows "$env:PES_VERSION" "release-win/PES-Windows-Setup.exe" "$env:RELEASE_REPO" "desktop-v$env:PES_VERSION"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES-Windows-Setup
          path: |
            release-win/PES-Windows-Setup.exe
            release-win/PES-Windows-manifest.json
          if-no-files-found: error
      - name: Publish public Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "Falta RELEASES_TOKEN con permiso Contents: write sobre lousoparaelmac6-code/pes-releases." }
          $tag = "desktop-v$env:PES_VERSION"
          $assets = @("release-win/PES-Windows-Setup.exe", "release-win/PES-Windows-manifest.json")
          gh release view $tag --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $env:RELEASE_REPO --clobber
          } else {
            gh release create $tag $assets --repo $env:RELEASE_REPO --target main --title "PES para Windows v$env:PES_VERSION" --notes "Instalador oficial de PES para Windows. La actualización conserva los datos de la aplicación."
          }
