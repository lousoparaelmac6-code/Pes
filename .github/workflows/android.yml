name: Build PES Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      PES_VERSION: 1.0.${{ github.run_number }}
      PES_VERSION_CODE: ${{ github.run_number }}
      RELEASE_REPO: lousoparaelmac6-code/pes-releases
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout PES
        uses: actions/checkout@v4
      - name: Verify stable Android signing key
        shell: bash
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::No se publicará un APK sin firma estable. Faltan GitHub Secrets: ${missing[*]}. Sin la misma clave, Android rechaza las actualizaciones."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build local web assets
        run: npm run build:web
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android updater and stable signing
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          node scripts/patch-android.mjs
      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify APK identity, version and stable signing certificate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$TOOLS_DIR/aapt"
          APKSIGNER="$TOOLS_DIR/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.gyj.pes' versionCode='$PES_VERSION_CODE' versionName='$PES_VERSION'" >/dev/null || {
            echo "::error::El APK no tiene el package ID, versionCode o versionName esperados."
            echo "$BADGING" | grep '^package:' || true
            exit 1
          }
          apk_cert() {
            local output
            output="$("$APKSIGNER" verify --print-certs "$1" 2>&1)" || { printf '%s\n' "$output"; return 1; }
            printf '%s\n' "$output" | grep -i 'SHA-256 digest' | head -n 1 | sed -E 's/.*[Ss][Hh][Aa]-256 digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          }
          CERT="$(apk_cert "$APK")"
          [ -n "$CERT" ] || { echo "::error::No se pudo leer el certificado SHA-256 del APK."; exit 1; }
          TAGS="$(gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName --jq '.[].tagName' | grep '^apk-v' | sort -V || true)"
          PREV_TAG="$(printf '%s\n' "$TAGS" | tail -n 1)"
          if [ -n "$PREV_TAG" ]; then
            PREV_DIR="$RUNNER_TEMP/pes-previous-apk"
            mkdir -p "$PREV_DIR"
            gh release download "$PREV_TAG" --repo "$RELEASE_REPO" --pattern "PES-Android.apk" --dir "$PREV_DIR"
            PREV_APK="$PREV_DIR/PES-Android.apk"
            PREV_BADGING="$("$AAPT" dump badging "$PREV_APK")"
            echo "$PREV_BADGING" | grep -F "package: name='com.gyj.pes'" >/dev/null || {
              echo "::error::El APK publicado anteriormente usa otro package ID."
              exit 1
            }
            PREV_CODE="$(printf '%s\n' "$PREV_BADGING" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            PREV_CERT="$(apk_cert "$PREV_APK")"
            [ -n "$PREV_CODE" ] && [ -n "$PREV_CERT" ] || { echo "::error::No se pudo verificar la versión o firma del APK anterior."; exit 1; }
            [ "$PES_VERSION_CODE" -gt "$PREV_CODE" ] || { echo "::error::El versionCode no aumentó respecto de $PREV_TAG."; exit 1; }
            [ "$CERT" = "$PREV_CERT" ] || { echo "::error::El certificado cambió respecto de $PREV_TAG; Android podría rechazar la actualización sobre la instalación existente."; exit 1; }
          fi
          echo "APK verificado: package=com.gyj.pes versionCode=$PES_VERSION_CODE versionName=$PES_VERSION certificateSHA256=$CERT previousTag=${PREV_TAG:-ninguno}"
      - name: Verify APK output
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::No se generó el APK release esperado."; exit 1; }
          mkdir -p release-android
          cp "$APK" release-android/PES-Android.apk
      - name: Generate update manifest
        run: node scripts/make-manifest.mjs android "$PES_VERSION" "release-android/PES-Android.apk" "$RELEASE_REPO" "apk-v$PES_VERSION"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES-Android-APK
          path: |
            release-android/PES-Android.apk
            release-android/PES-Android-manifest.json
          if-no-files-found: error
      - name: Publish public Android release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta RELEASES_TOKEN con permiso Contents: write sobre lousoparaelmac6-code/pes-releases."
            exit 1
          fi
          TAG="apk-v$PES_VERSION"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-android/PES-Android.apk release-android/PES-Android-manifest.json --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" release-android/PES-Android.apk release-android/PES-Android-manifest.json --repo "$RELEASE_REPO" --target main --title "PES para Android v$PES_VERSION" --notes "APK oficial de PES para Android. La actualización requiere firma compatible y conserva los datos."
          fi
